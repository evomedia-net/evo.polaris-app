# Proves the Android app builds from a clean checkout: the pinned polaris
# release is fetched and checked, copied into the project, and compiled into
# a debug APK, kept as a download on the run. Unsigned: store builds are
# signed with the upload key, which never leaves Kelly's machine.
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run fetch-site
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: evo.polaris-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
